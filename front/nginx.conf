server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads (logos, captures, PDF) : limite alignee sur le backend (10 Mo)
    client_max_body_size 10m;

    # L'API est relayee vers le conteneur backend (meme origine => pas de probleme CORS)
    location /api/ {
        proxy_pass http://back:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routage Angular : toute autre route renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
