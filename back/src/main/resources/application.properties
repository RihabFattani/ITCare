spring.application.name=itcare
# 8080 est deja utilise sur cette machine (ApplicationWebServer.exe)
server.port=8081

# --- Base de donnees MySQL (la base "itcare" est creee automatiquement) ---
# XAMPP : utilisateur "root" avec mot de passe VIDE par defaut (port 3306)
# Si vous avez defini un mot de passe, modifiez-le ici ou via la variable d'environnement DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/itcare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Tunis
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA : les tables sont creees/mises a jour a partir des entites ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Upload de fichiers (Multipart) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- JWT : en production, definir la variable d'environnement JWT_SECRET (32 caracteres minimum) ---
app.jwt.secret=${JWT_SECRET:itcare-dev-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

# --- Application ---
app.base-url=http://localhost:8081
app.mail-from=no-reply@itcare.tn
# Rappel quotidien a l'admin : tous les jours a 08:00 (incidents HAUTE ouverts depuis plus de 24 h)
app.reminder.cron=0 0 8 * * *

# --- SMTP : decommentez et renseignez pour envoyer de vrais emails ---
# Sans SMTP, le contenu des emails est affiche dans la console (pratique en developpement).
# Exemple Gmail (mot de passe d'application) ; Mailtrap est une alternative de test.
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=votre.adresse@gmail.com
#spring.mail.password=mot-de-passe-application
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# --- Dossier de stockage (logos, captures, rapports). Sera place hors du jar au deploiement ---
app.upload-dir=uploads
