spring.application.name=itcare
# 8080 est deja utilise sur cette machine (ApplicationWebServer.exe)
server.port=8081

# --- Base de donnees MySQL (la base "itcare" est creee automatiquement) ---
# XAMPP : utilisateur "root" avec mot de passe VIDE par defaut (port 3306)
# Si vous avez defini un mot de passe, modifiez-le ici ou via la variable d'environnement DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/itcare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Tunis
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA : les tables sont creees/mises a jour a partir des entites ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Upload de fichiers (Multipart) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- Dossier de stockage (logos, captures, rapports). Sera place hors du jar au deploiement ---
app.upload-dir=uploads
